services:
  - type: web
    name: btc-portfolio-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: btc-portfolio-db
          property: connectionString
      - key: JWT_SECRET_KEY
        sync: false
      - key: JWT_EXPIRES_MINUTES
        value: "1440"
      - key: CORS_ORIGINS
        sync: false
      - key: COINGECKO_API_KEY
        sync: false
      - key: MARKET_CACHE_TTL_SECONDS
        value: "60"
  - type: web
    name: btc-portfolio-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false

databases:
  - name: btc-portfolio-db
    plan: free

